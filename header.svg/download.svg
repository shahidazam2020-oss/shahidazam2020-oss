<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
  <rect width="720" height="1280" fill="#f7f7f4"></rect>

  <rect x="38" y="19" width="644" height="1242" rx="34" fill="#ffffff" stroke="#d9d9d4" stroke-width="1"></rect>

  <!-- Header -->
  <text x="91" y="96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="4" fill="#285d58">ONE LAST THING</text>

  <text x="91" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="47" font-weight="700" fill="#202936">Session Feedback</text>

  <!-- Description -->
  <text x="91" y="244" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#56616c">After your guidance session, please</text>

  <text x="91" y="291" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#56616c">rate your experience and share any</text>

  <text x="91" y="337" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#56616c">thoughts. This helps us improve</text>

  <text x="91" y="384" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#56616c">future sessions.</text>

  <!-- Rating Question -->
  <text x="91" y="457" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#202936">How would you rate the session?</text>

  <!-- Stars -->
  <text x="91" y="535" font-family="Arial, Helvetica, sans-serif" font-size="53" fill="#deded9">★</text>

  <text x="148" y="535" font-family="Arial, Helvetica, sans-serif" font-size="53" fill="#deded9">★</text>

  <text x="205" y="535" font-family="Arial, Helvetica, sans-serif" font-size="53" fill="#deded9">★</text>

  <text x="262" y="535" font-family="Arial, Helvetica, sans-serif" font-size="53" fill="#deded9">★</text>

  <text x="319" y="535" font-family="Arial, Helvetica, sans-serif" font-size="53" fill="#deded9">★</text>

  <!-- First Question -->
  <text x="91" y="580" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#202936">What did you like most about the</text>

  <text x="91" y="623" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#202936">session?</text>

  <!-- First Textarea -->
  <rect x="91" y="653" width="538" height="152" rx="14" fill="#ffffff" stroke="#d7d7d5" stroke-width="1"></rect>

  <text x="118" y="704" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#777b80">Optional</text>

  <!-- Second Question -->
  <text x="91" y="887" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#202936">Any suggestions for improvement?</text>

  <!-- Second Textarea -->
  <rect x="91" y="917" width="538" height="152" rx="14" fill="#ffffff" stroke="#d7d7d5" stroke-width="1"></rect>

  <text x="118" y="968" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#777b80">Optional</text>

  <!-- Submit Button -->
  <rect x="91" y="1119" width="344" height="88" rx="44" fill="#195e57"></rect>

  <text x="263" y="1175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Submit Feedback</text>
</svg>